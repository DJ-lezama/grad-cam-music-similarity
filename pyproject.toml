[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicsim"
version = "1.0.0"
description = "Grad-CAM study of a Siamese CNN for audio-based musical similarity (MelodySim / MCIC)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "librosa>=0.10",
    "soundfile",
    "matplotlib",
    "pyarrow",
    "huggingface_hub",
    "tqdm",
    "opencv-python-headless",
    "scikit-image",
    "dtaidistance",
]

[project.optional-dependencies]
notebook = ["jupyter", "ipykernel"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.setuptools.packages.find]
where = ["src"]
